# ==========================================
# Shared configuration for autonomous patrol robots
# ==========================================

# 0 = M1 robot configuration, 1 = M3PRO robot configuration, 2 = local Windows test configuration
select_config: 2

# Robot settings
robot:
  robot_id: 0

# Paths are relative to this configuration file; absolute paths are also accepted.
paths:
  map_yaml:
    0: "../maps/yahboomcar.yaml"
    1: "../maps/yahboom_map2.yaml"
    2: "../maps/yahboomcar.yaml"
  
  image_dir:
    0: "../tempphoto"
    1: "../tempphoto"
    2: "../tempphoto"

# Core algorithm parameters
algorithm:
  base_size: 15
  cell_size: 1
  safety_radius_m: 0
  white_ratio_threshold: 0.85  

# Communication and network settings
network:
  server_url: "http://127.0.0.1:9999/report"
