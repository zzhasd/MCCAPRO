<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Robot Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        
        /* Two-column layout */
        .layout-wrapper { display: flex; gap: 20px; max-width: 1700px; margin: 0 auto; }
        .panel { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .left-panel { flex: 0 0 45%; display: flex; flex-direction: column; }
        .right-panel { flex: 1; display: flex; flex-direction: column; align-items: center; } 
        
        /* Title container and language button */
        .header-container { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        h2 { text-align: center; color: #1a1a1a; margin: 0; }
        .lang-btn { position: absolute; right: 0; padding: 6px 12px; font-size: 14px; font-weight: bold; color: #555; background: #fff; border: 1px solid #d9d9d9; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .lang-btn:hover { background: #e6e8eb; color: #1a1a1a; border-color: #1890ff;}

        .status-bar { display: flex; justify-content: space-around; flex-wrap: wrap; margin-bottom: 25px; padding: 12px; background: #fdfdfd; border-bottom: 2px solid #f0f2f5; width: 100%; box-sizing: border-box;}
        .status-item { font-size: 25px; color: #555; margin: 5px 10px; }
        .status-item b { color: #007bff; font-family: monospace; font-size: 28px; }
        
        /* ✨ Highlight coverage */
        .highlight-cov b { color: #d9363e !important; font-size: 28px; } 

        #speed-chart { width: 100%; height: 450px; }
        
        .weights-panel { display: flex; justify-content: space-around; margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 12px; border: 1px solid #eee; width: 100%; box-sizing: border-box;}
        
        /* Change: remove relative positioning from cards and the oversized global font */
        .weight-card { text-align: center; width: 45%; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .robot-0 { color: var(--robot-0-color, #5470c6); }
        .robot-1 { color: var(--robot-1-color, #d9363e); }
        
        /* New: show weight information on one line (ID | weight | battery) */
        .info-row { display: flex; justify-content: space-around; align-items: center; margin-bottom: 15px; }
        .rob-label { font-size: 26px; font-weight: bold; }
        .rob-weight { font-size: 38px; font-weight: bold;}
        
        /* Change: remove absolute positioning and enlarge battery text to fit the Flex layout */
        .battery-box { font-size: 20px; padding: 6px 12px; border-radius: 8px; background: #f0f2f5; color: #333; font-weight: bold;}
        .battery-low { background: #ffe5e5; color: #d9363e; }
        
        .speed-panel { margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;}
        .gear-btn { padding: 6px 10px; font-size: 13px; font-weight: bold; color: #555; background: #f0f2f5; border: 1px solid #d9d9d9; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .gear-btn:hover { background: #e6e8eb; }
        .robot-0 .gear-btn.active { background: var(--robot-0-color, #5470c6); color: white; border-color: var(--robot-0-color, #5470c6); }
        .robot-1 .gear-btn.active { background: var(--robot-1-color, #d9363e); color: white; border-color: var(--robot-1-color, #d9363e); }
        .gear-btn.danger.active { background: #faad14 !important; color: white !important; border-color: #faad14 !important; }
        
        .offline-btn { background: #ff4d4f; color: white; border-color: #ff4d4f; }
        .offline-btn:hover { background: #ff7875; }
        .offline-btn.active { background: #a8071a !important; border-color: #a8071a !important; cursor: not-allowed; }

        .map-square-box { 
            max-width: 100%; 
            background: #f0f2f5; 
            border-radius: 12px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            border: 1px solid #ddd;
            min-height: 200px;
            min-width: 300px;
        }
        .map-container-inner { position: relative; }
        
        #map-bg { 
            position: absolute; 
            left: 55px; right: 30px; top: 40px; bottom: 50px; 
            background-size: 100% 100%; 
            opacity: 0.65; 
            display: none; 
            z-index: 1;
        }
        #coverage-canvas, #assignment-canvas {
            position: absolute; 
            left: 55px; right: 30px; top: 40px; bottom: 50px;
            pointer-events: none; 
            width: calc(100% - 85px); 
            height: calc(100% - 90px);
        }
        #coverage-canvas {
            z-index: 2;
            opacity: 0.7;
        }
        /* ✨ Assigned-region border layer: above the map and below ECharts trajectories */
        #assignment-canvas {
            z-index: 3;
            opacity: 1;
        }
        #map-chart { 
            position: absolute; 
            left: 0; right: 0; top: 0; bottom: 0; 
            z-index: 4;
        }
    </style>
</head>
<body>

<div class="layout-wrapper">
    <div class="panel left-panel">
        <div class="header-container">
            <h2 id="txt-titleMain">🚀 Mission Monitoring Center (Battery-Aware)</h2>
            <button class="lang-btn" onclick="toggleLang()">🌐 CN/EN</button>
        </div>
        <div class="status-bar">
            <div class="status-item"><span id="txt-r0Data">📥 R0 Data:</span> <b id="count-0">0</b></div>
            <div class="status-item"><span id="txt-r1Data">📥 R1 Data:</span> <b id="count-1">0</b></div>
            <div class="status-item"><span id="txt-runTime">🕒 Runtime:</span> <b id="run-time">0</b></div>
        </div>
        <div id="speed-chart"></div>
        <div class="weights-panel">
            <div class="weight-card robot-0">
                <div class="info-row">
                    <span class="rob-label">R0</span>
                    <span class="rob-weight" id="weight-0">0.500</span>
                    <div class="battery-box" id="bat-box-0">🔋 <span id="bat-0">100</span>%</div>
                </div>
                <div class="speed-panel">
                    <button class="gear-btn offline-btn" id="btn-0--1" onclick="forceOffline(0)">Force Offline</button>
                    <button class="gear-btn danger" id="btn-0-0" onclick="changeSpeed(0, 0)">0 (Stop)</button>
                    <button class="gear-btn" id="btn-0-2" onclick="changeSpeed(0, 2)">2 (Half Speed)</button>
                    <button class="gear-btn" id="btn-0-4" onclick="changeSpeed(0, 4)">4 (Full Speed)</button>
                </div>
            </div>
            <div class="weight-card robot-1">
                <div class="info-row">
                    <span class="rob-label">R1</span>
                    <span class="rob-weight" id="weight-1">0.500</span>
                    <div class="battery-box" id="bat-box-1">🔋 <span id="bat-1">100</span>%</div>
                </div>
                <div class="speed-panel">
                    <button class="gear-btn offline-btn" id="btn-1--1" onclick="forceOffline(1)">Force Offline</button>
                    <button class="gear-btn danger" id="btn-1-0" onclick="changeSpeed(1, 0)">0 (Stop)</button>
                    <button class="gear-btn" id="btn-1-2" onclick="changeSpeed(1, 2)">2 (Half Speed)</button>
                    <button class="gear-btn" id="btn-1-4" onclick="changeSpeed(1, 4)">4 (Full Speed)</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel right-panel">
        <h2 id="txt-titleMap" style="margin-bottom: 15px;">🗺️ Live Routes and Patrol Map</h2>
        <div class="status-bar">
            
            <div class="status-item highlight-cov"><span id="txt-coverage">🎯 Global Coverage:</span> <b id="coverage-rate">0.00%</b></div>
        </div>
        <div class="map-square-box" id="map-square-box">
            <div class="map-container-inner" id="map-container-inner">
                <div id="map-bg"></div>
                <canvas id="coverage-canvas"></canvas>
                <canvas id="assignment-canvas"></canvas>
                <div id="map-chart"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Language settings ---
    const i18n = {
        CN: {
            titleMain: "🚀 Mission Monitoring Center (Battery-Aware)", titleMap: "🗺️ Live Routes and Patrol Map",
            runTime: "🕒 Runtime:", r0Data: "📥 R0 Data:", r1Data: "📥 R1 Data:",
            btnOffline: "Force Offline",
            btnStop: "0 (Stop)", btnHalf: "2 (Half Speed)", btnFull: "4 (Full Speed)",
            chartSpdLegend0: "R0 Speed", chartSpdLegend1: "R1 Speed", chartSpdX: "Timeline", chartSpdY: "Speed(m/s)",
            coverage: "🎯 Global Coverage:"
        },
        EN: {
            titleMain: "🚀 Task Monitor (Battery Aware)", titleMap: "🗺️ Real-time Path & Map",
            runTime: "🕒 Run Time:", r0Data: "📥 R0 Data:", r1Data: "📥 R1 Data:",
            btnOffline: "Offline",
            btnStop: "0 (Stop)", btnHalf: "2 (Half)", btnFull: "4 (Full)",
            chartSpdLegend0: "R0 Speed", chartSpdLegend1: "R1 Speed", chartSpdX: "Time", chartSpdY: "Speed(m/s)",
            coverage: "🎯 Coverage Rate:"
        }
    };

    let currentLang = 'EN';
    let currentGlobalPhase = 1;

    const phaseRobotColors = {
        1: ['#5470c6', '#d9363e'],
        2: ['#fc8452', '#91cc75']
    };

    function applyLanguage() {
        const t = i18n[currentLang];

        document.getElementById('txt-titleMain').innerText = t.titleMain;
        document.getElementById('txt-titleMap').innerText = t.titleMap;
        document.getElementById('txt-runTime').innerText = t.runTime;
        document.getElementById('txt-r0Data').innerText = t.r0Data;
        document.getElementById('txt-r1Data').innerText = t.r1Data;
        document.getElementById('txt-coverage').innerText = t.coverage;

        for (let i = 0; i < 2; i++) {
            document.getElementById(`btn-${i}--1`).innerText = t.btnOffline;
            document.getElementById(`btn-${i}-0`).innerText = t.btnStop;
            document.getElementById(`btn-${i}-2`).innerText = t.btnHalf;
            document.getElementById(`btn-${i}-4`).innerText = t.btnFull;
        }

        speedChart.setOption({
            legend: { data: [t.chartSpdLegend0, t.chartSpdLegend1] },
            xAxis: { name: t.chartSpdX },
            yAxis: { name: t.chartSpdY },
            series: [
                { name: t.chartSpdLegend0 },
                { name: t.chartSpdLegend1 }
            ]
        });
    }

    function toggleLang() {
        currentLang = currentLang === 'CN' ? 'EN' : 'CN';
        applyLanguage();
    applyPhaseRobotColors(currentGlobalPhase);
    }

    // =========================
    // Speed chart
    // =========================
    var speedChart = echarts.init(document.getElementById('speed-chart'));

    speedChart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['R0 Speed', 'R1 Speed'] },
        grid: { left: '8%', right: '8%', bottom: '5%', top: '15%', containLabel: true },
        xAxis: {
            type: 'category',
            name: 'Timeline',
            boundaryGap: false,
            data: Array.from({ length: 20 }, (_, i) => `T-${19 - i}`)
        },
        yAxis: { type: 'value', name: 'Speed(m/s)' },
        series: [
            {
                name: 'R0 Speed',
                type: 'line',
                smooth: true,
                symbolSize: 6,
                data: [],
                lineStyle: { color: '#5470c6' },
                itemStyle: { color: '#5470c6' },
                areaStyle: { opacity: 0.1, color: '#5470c6' }
            },
            {
                name: 'R1 Speed',
                type: 'line',
                smooth: true,
                symbolSize: 6,
                data: [],
                lineStyle: { color: '#d9363e' },
                itemStyle: { color: '#d9363e' },
                areaStyle: { opacity: 0.1, color: '#d9363e' }
            }
        ],
        animation: false
    });

    function applyPhaseRobotColors(phase = currentGlobalPhase) {
        const colors = phaseRobotColors[phase] || phaseRobotColors[1];

        document.documentElement.style.setProperty('--robot-0-color', colors[0]);
        document.documentElement.style.setProperty('--robot-1-color', colors[1]);

        speedChart.setOption({
            series: [
                {
                    lineStyle: { color: colors[0] },
                    itemStyle: { color: colors[0] },
                    areaStyle: { opacity: 0.1, color: colors[0] }
                },
                {
                    lineStyle: { color: colors[1] },
                    itemStyle: { color: colors[1] },
                    areaStyle: { opacity: 0.1, color: colors[1] }
                }
            ]
        });
    }

    // =========================
    // Map ECharts layer
    // =========================
    var mapChart = echarts.init(document.getElementById('map-chart'));
    let mLeft = 55, mRight = 30, mTop = 40, mBottom = 50;

    mapChart.setOption({
        tooltip: {
            trigger: 'item',
            formatter: function (params) {
                return `${params.seriesName}: (${params.value[0].toFixed(2)}, ${params.value[1].toFixed(2)})`;
            }
        },
        grid: {
            left: mLeft,
            right: mRight,
            top: mTop,
            bottom: mBottom,
            show: false
        },
        xAxis: {
            type: 'value',
            name: 'X (m)',
            nameLocation: 'middle',
            nameGap: 25,
            splitLine: { show: false },
            axisLine: {
                show: true,
                lineStyle: { type: 'dashed', opacity: 0.3 }
            },
            axisLabel: {
                formatter: function (value) {
                    return value.toFixed(1);
                }
            }
        },
        yAxis: {
            type: 'value',
            name: 'Y (m)',
            nameLocation: 'middle',
            nameGap: 30,
            splitLine: { show: false },
            axisLine: {
                show: true,
                lineStyle: { type: 'dashed', opacity: 0.3 }
            },
            axisLabel: {
                formatter: function (value) {
                    return value.toFixed(1);
                }
            }
        },
        series: [
            { name: 'R0 Route (old)', type: 'line', showSymbol: false, smooth: 0.3, lineStyle: { color: '#5470c6', width: 4, opacity: 1 }, data: [] },
            { name: 'R1 Route (old)', type: 'line', showSymbol: false, smooth: 0.3, lineStyle: { color: '#d9363e', width: 4, opacity: 1 }, data: [] },

            { name: 'R0 Route (new)', type: 'line', showSymbol: false, smooth: 0.3, lineStyle: { color: '#fc8452', width: 4, opacity: 1 }, data: [] },
            { name: 'R1 Route (new)', type: 'line', showSymbol: false, smooth: 0.3, lineStyle: { color: '#91cc75', width: 4, opacity: 1 }, data: [] },

            { name: 'R0 Radius', type: 'scatter', symbolSize: 0, itemStyle: { color: 'rgba(255, 250, 180, 0.001)', borderColor: '#FFCC00', borderWidth: 4 }, zlevel: 5, data: [], animation: false },
            { name: 'R1 Radius', type: 'scatter', symbolSize: 0, itemStyle: { color: 'rgba(255, 250, 180, 0.001)', borderColor: '#FFCC00', borderWidth: 4 }, zlevel: 5, data: [], animation: false },

            { name: 'R0 Current', type: 'scatter', symbolSize: 12, itemStyle: { color: '#5470c6', borderColor: '#fff', borderWidth: 4 }, zlevel: 10, data: [] },
            { name: 'R1 Current', type: 'scatter', symbolSize: 12, itemStyle: { color: '#d9363e', borderColor: '#fff', borderWidth: 4 }, zlevel: 10, data: [] }
        ],
        animation: false
    });

    applyLanguage();

    let currentMapInfo = null;
    let mapInitialized = false;
    let globalCoverageRadius = 0;

    // ==========================================
    // Efficient pixel-level coverage calculation and rendering on Canvas
    // ==========================================
    let imgWidth = 0;
    let imgHeight = 0;
    let mapResolution = 1.0;

    let freeMask = null;
    let coveredMask = null;
    let totalFreePixels = 0;
    let coveredCount = 0;

    let coverageCanvas = document.getElementById('coverage-canvas');
    let coverageCtx = coverageCanvas.getContext('2d', { willReadFrequently: true });
    let coverageImageData = null;
    let parsedPathsIndex = [0, 0];

    // ==========================================
    // Assigned-region border layer: draw only stroke, no facecolor
    // ==========================================
    let assignmentCanvas = document.getElementById('assignment-canvas');
    let assignmentCtx = assignmentCanvas.getContext('2d');

    let latestAssignmentPayload = null;
    let lastAssignmentDrawKey = null;

    const phaseLineColors = phaseRobotColors;

    function hexToPastelRgba(hex, alpha = 0.85, lighten = 0.55) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
            hex = hex.split('').map(c => c + c).join('');
        }

        let r = parseInt(hex.slice(0, 2), 16);
        let g = parseInt(hex.slice(2, 4), 16);
        let b = parseInt(hex.slice(4, 6), 16);

        r = Math.round(r + (255 - r) * lighten);
        g = Math.round(g + (255 - g) * lighten);
        b = Math.round(b + (255 - b) * lighten);

        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawAssignmentRects(rectsByRobot, phase) {
        if (
            !assignmentCanvas.width ||
            !assignmentCanvas.height ||
            !currentMapInfo ||
            !mapResolution ||
            !imgWidth ||
            !imgHeight
        ) {
            return false;
        }

        assignmentCtx.clearRect(0, 0, assignmentCanvas.width, assignmentCanvas.height);

        if (!Array.isArray(rectsByRobot)) {
            return false;
        }

        const colors = phaseLineColors[phase] || phaseLineColors[1];

        assignmentCtx.save();
        assignmentCtx.lineWidth = 0.75;
        assignmentCtx.setLineDash([]);

        rectsByRobot.forEach((robotRects, rid) => {
            if (!Array.isArray(robotRects)) return;

            assignmentCtx.strokeStyle = hexToPastelRgba(
                colors[rid % colors.length],
                1,
                0.2
            );

            robotRects.forEach(rect => {
                const x = Number(rect.x);
                const y = Number(rect.y);
                const w = Number(rect.w);
                const h = Number(rect.h);

                if (![x, y, w, h].every(Number.isFinite)) return;

                // rect uses world-coordinate lower-left position plus width/height;
                // canvas The origin is at the top-left of the image, so invert y.
                const xPx = (x - currentMapInfo.origin_x) / mapResolution;
                const yPx = imgHeight - ((y + h - currentMapInfo.origin_y) / mapResolution);
                const wPx = w / mapResolution;
                const hPx = h / mapResolution;

                assignmentCtx.strokeRect(
                    Math.round(xPx) + 0.5,
                    Math.round(yPx) + 0.5,
                    Math.round(wPx),
                    Math.round(hPx)
                );
            });
        });

        assignmentCtx.restore();
        return true;
    }

    function maybeRedrawAssignmentRects(force = false) {
        if (!latestAssignmentPayload) return;

        const drawKey = `${latestAssignmentPayload.version}-${latestAssignmentPayload.phase}`;

        if (!force && drawKey === lastAssignmentDrawKey) {
            return;
        }

        const ok = drawAssignmentRects(
            latestAssignmentPayload.rects || [],
            latestAssignmentPayload.phase
        );

        // Record the successful draw key only after rendering: drawKey.
        // Avoid locking before the image loads, which would skip later rendering.
        if (ok) {
            lastAssignmentDrawKey = drawKey;
        }
    }

    function initCoverageCanvas(imgSrc, mapInfo) {
        let img = new Image();

        img.onload = () => {
            imgWidth = img.width;
            imgHeight = img.height;
            mapResolution = mapInfo.real_w / imgWidth;

            coverageCanvas.width = imgWidth;
            coverageCanvas.height = imgHeight;
            assignmentCanvas.width = imgWidth;
            assignmentCanvas.height = imgHeight;

            // Setting canvas width/height clears it, so allow a forced redraw afterward.
            lastAssignmentDrawKey = null;

            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgWidth;
            tempCanvas.height = imgHeight;

            let tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(img, 0, 0);

            let pixels = tCtx.getImageData(0, 0, imgWidth, imgHeight).data;

            freeMask = new Uint8Array(imgWidth * imgHeight);
            coveredMask = new Uint8Array(imgWidth * imgHeight);
            coverageImageData = coverageCtx.createImageData(imgWidth, imgHeight);

            totalFreePixels = 0;

            for (let i = 0; i < pixels.length; i += 4) {
                if (pixels[i] > 240 && pixels[i + 1] > 240 && pixels[i + 2] > 240) {
                    freeMask[i / 4] = 1;
                    totalFreePixels++;
                }
            }

            parsedPathsIndex = [0, 0];

            // Force one assigned-grid redraw after the image loads.
            maybeRedrawAssignmentRects(true);
        };

        img.src = imgSrc;
    }

    function resetCoverageCanvas() {
        if (!coveredMask || !coverageImageData) return;

        coveredMask.fill(0);
        coveredCount = 0;
        coverageImageData.data.fill(0);
        coverageCtx.putImageData(coverageImageData, 0, 0);

        parsedPathsIndex = [0, 0];
        document.getElementById('coverage-rate').innerText = '0.00%';
    }

    function updateCoverageArea(paths) {
        if (!freeMask || totalFreePixels === 0) return;

        let pixelRadius = Math.round(globalCoverageRadius / mapResolution);
        if (pixelRadius <= 0) return;

        let pr2 = pixelRadius * pixelRadius;
        let imgDataArray = coverageImageData.data;
        let isDirty = false;

        for (let rId = 0; rId < paths.length; rId++) {
            let path = paths[rId];
            if (!path) continue;

            for (let i = parsedPathsIndex[rId]; i < path.length; i++) {
                let pt = path[i];

                let px = Math.round((pt[0] - currentMapInfo.origin_x) / mapResolution);
                let py = Math.round(imgHeight - (pt[1] - currentMapInfo.origin_y) / mapResolution);

                for (let dy = -pixelRadius; dy <= pixelRadius; dy++) {
                    for (let dx = -pixelRadius; dx <= pixelRadius; dx++) {
                        if (dx * dx + dy * dy <= pr2) {
                            let nx = px + dx;
                            let ny = py + dy;

                            if (nx >= 0 && nx < imgWidth && ny >= 0 && ny < imgHeight) {
                                let idx = ny * imgWidth + nx;

                                if (freeMask[idx] === 1 && coveredMask[idx] === 0) {
                                    coveredMask[idx] = 1;
                                    coveredCount++;

                                    let pixelIdx = idx * 4;
                                    imgDataArray[pixelIdx] = 255;
                                    imgDataArray[pixelIdx + 1] = 250;
                                    imgDataArray[pixelIdx + 2] = 180;
                                    imgDataArray[pixelIdx + 3] = 80;

                                    isDirty = true;
                                }
                            }
                        }
                    }
                }
            }

            parsedPathsIndex[rId] = path.length;
        }

        if (isDirty) {
            coverageCtx.putImageData(coverageImageData, 0, 0);

            let rate = (coveredCount / totalFreePixels) * 100;
            document.getElementById('coverage-rate').innerText = rate.toFixed(2) + '%';
        }
    }

    function resizeMap() {
        if (!currentMapInfo) return;

        let inner = document.getElementById('map-container-inner');
        let panel = document.querySelector('.right-panel');

        let maxW = panel.clientWidth - 50;
        if (maxW <= 0) return;

        let R = currentMapInfo.real_w / currentMapInfo.real_h;
        let mWidth = mLeft + mRight;
        let mHeight = mTop + mBottom;

        let W = maxW;
        let GW = W - mWidth;
        let GH = GW / R;
        let H = GH + mHeight;

        let maxH = window.innerHeight * 0.65;

        if (H > maxH) {
            H = maxH;
            GH = H - mHeight;
            GW = GH * R;
            W = GW + mWidth;
        }

        inner.style.width = W + 'px';
        inner.style.height = H + 'px';

        mapChart.resize();

        // resize only applies CSS scaling to the canvas, so a redraw is normally unnecessary;
        // Force a redraw here to refresh borders after layout updates in some browsers.
        maybeRedrawAssignmentRects(true);
    }

    function updateDashboard() {
        fetch('/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('run-time').innerText = data.run_time;
                document.getElementById('count-0').innerText = data.data_counts[0] || 0;
                document.getElementById('count-1').innerText = data.data_counts[1] || 0;
                document.getElementById('weight-0').innerText = data.weights[0].toFixed(2);
                document.getElementById('weight-1').innerText = data.weights[1].toFixed(2);

                if (data.coverage_radius) {
                    globalCoverageRadius = data.coverage_radius;
                }

                latestAssignmentPayload = {
                    version: data.assignment_version || 0,
                    rects: data.assignment_rects || [],
                    phase: data.phase || currentGlobalPhase
                };

                speedChart.setOption({
                    series: [
                        { data: data.histories[0] },
                        { data: data.histories[1] }
                    ]
                });

                for (let i = 0; i < 2; i++) {
                    let bat = data.batteries[i];

                    document.getElementById(`bat-${i}`).innerText = bat.toFixed(1);

                    let box = document.getElementById(`bat-box-${i}`);
                    if (bat < 10.0) {
                        box.classList.add('battery-low');
                    } else {
                        box.classList.remove('battery-low');
                    }

                    updateButtonStates(i, data.speeds[i]);
                }

                let mi = data.map_info;

                if (mi) {
                    if (!mapInitialized) {
                        currentMapInfo = mi;

                        document.getElementById('map-bg').style.backgroundImage = "url('/map.png')";
                        document.getElementById('map-bg').style.display = "block";

                        resizeMap();

                        mapChart.setOption({
                            xAxis: {
                                min: mi.origin_x,
                                max: mi.origin_x + mi.real_w
                            },
                            yAxis: {
                                min: mi.origin_y,
                                max: mi.origin_y + mi.real_h
                            }
                        });

                        initCoverageCanvas('/map.png', mi);
                        mapInitialized = true;
                    }

                    if (data.phase === 2 && currentGlobalPhase === 1) {
                        currentGlobalPhase = 2;
                        applyPhaseRobotColors(currentGlobalPhase);
                        resetCoverageCanvas();

                        // phase On switching, clear old borders and redraw borders for the new weights.
                        lastAssignmentDrawKey = null;
                        maybeRedrawAssignmentRects(true);
                    } else {
                        maybeRedrawAssignmentRects();
                    }

                    function filterPath(path) {
                        return path.filter(p =>
                            p[0] >= mi.origin_x &&
                            p[0] <= (mi.origin_x + mi.real_w) &&
                            p[1] >= mi.origin_y &&
                            p[1] <= (mi.origin_y + mi.real_h)
                        );
                    }

                    let p0_1 = filterPath(data.paths_1[0] || []);
                    let p0_2 = filterPath(data.paths_2[0] || []);
                    let p1_1 = filterPath(data.paths_1[1] || []);
                    let p1_2 = filterPath(data.paths_2[1] || []);

                    let paths_to_calculate = [];

                    if (currentGlobalPhase === 1) {
                        paths_to_calculate = [p0_1, p1_1];
                    } else {
                        paths_to_calculate = [p0_2, p1_2];
                    }

                    updateCoverageArea(paths_to_calculate);

                    let path0_full = p0_1.concat(p0_2);
                    let path1_full = p1_1.concat(p1_2);

                    let dynamicSymbolSize = 0;

                    if (globalCoverageRadius > 0) {
                        let mapDom = document.getElementById('map-chart');
                        let echartGridPixelWidth = mapDom.clientWidth - mLeft - mRight;
                        let pixelsPerMeter = echartGridPixelWidth / mi.real_w;

                        dynamicSymbolSize = globalCoverageRadius * 2 * pixelsPerMeter;
                    }

                    let curr0 = path0_full.length > 0 ? [path0_full[path0_full.length - 1]] : [];
                    let curr1 = path1_full.length > 0 ? [path1_full[path1_full.length - 1]] : [];

                    let r0_color = p0_2.length > 0 ? '#fc8452' : '#5470c6';
                    let r1_color = p1_2.length > 0 ? '#91cc75' : '#d9363e';

                    mapChart.setOption({
                        series: [
                            { data: p0_1 },
                            { data: p1_1 },
                            { data: p0_2 },
                            { data: p1_2 },
                            { data: curr0, symbolSize: dynamicSymbolSize },
                            { data: curr1, symbolSize: dynamicSymbolSize },
                            {
                                data: curr0,
                                itemStyle: {
                                    color: r0_color,
                                    borderColor: '#fff',
                                    borderWidth: 2
                                }
                            },
                            {
                                data: curr1,
                                itemStyle: {
                                    color: r1_color,
                                    borderColor: '#fff',
                                    borderWidth: 2
                                }
                            }
                        ]
                    });
                }
            })
            .catch(e => console.error("Failed to fetch data:", e));
    }

    function changeSpeed(robotId, speed) {
        fetch('/set_speed', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: robotId, speed: speed })
        }).then(() => updateDashboard());
    }

    function forceOffline(robotId) {
        fetch('/force_offline', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: robotId })
        }).then(() => updateDashboard());
    }

    function updateButtonStates(robotId, activeSpeed) {
        let gears = [-1, 0, 2, 4];

        gears.forEach(g => {
            let btn = document.getElementById(`btn-${robotId}-${g}`);

            if (btn) {
                if (g === activeSpeed) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        });
    }

    window.addEventListener('resize', () => {
        speedChart.resize();

        if (mapInitialized) {
            resizeMap();
        }
    });

    setInterval(updateDashboard, 1000);
</script>

</body>
</html>
